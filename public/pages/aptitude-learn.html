<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4P5RF6RD8J"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4P5RF6RD8J');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptitude Learning | KeyRacer</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/aptitude.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="tutorial-header">
        <div class="header-content">
            <div class="logo-section">
                <a href="../index.html">
                    <img src="../assets/images/logo.png" alt="Logo" class="logo-img">
                </a>
            </div>
            <nav class="main-nav">
                <a href="aptitude-learn.html" class="nav-item active"><i class="fas fa-book"></i> Learn</a>
                <a href="aptitude-challenges.html" class="nav-item"><i class="fas fa-brain"></i> Challenges</a>
                <a href="aptitude-leaderboard.html" class="nav-item"><i class="fas fa-trophy"></i> Leaderboard</a>
                <a href="../index.html" class="nav-item preference-nav"><i class="fas fa-cog"></i> Preference</a>
            </nav>
            <div class="header-actions">
                <div class="user-section">
                    <a href="login.html" class="login-btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </a>
                    <a href="#" class="logout-btn" id="logoutBtn" style="display: none;">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="simple-learn-wrapper">
        <!-- Topic Selection Screen -->
        <div class="learn-welcome-screen" id="learnWelcomeScreen">
            <div class="learn-welcome-card">
                <i class="fas fa-book-open welcome-icon"></i>
                <h1 class="welcome-title">Learn Aptitude</h1>
                <p class="welcome-subtitle">Master concepts with our comprehensive guides</p>
                
                <div class="learn-topic-grid">
                    <button class="learn-topic-card" data-topic="quant">
                        <i class="fas fa-calculator"></i>
                        <span>Quantitative</span>
                        <small>Numbers, Algebra, Geometry</small>
                    </button>
                    <button class="learn-topic-card" data-topic="logical-reasoning">
                        <i class="fas fa-puzzle-piece"></i>
                        <span>Logical Reasoning</span>
                        <small>Patterns, Sequences, Logic</small>
                    </button>
                    <button class="learn-topic-card" data-topic="verbal">
                        <i class="fas fa-language"></i>
                        <span>Verbal Ability</span>
                        <small>Grammar, Vocabulary, Reading</small>
                    </button>
                    <button class="learn-topic-card" data-topic="puzzles">
                        <i class="fas fa-lightbulb"></i>
                        <span>Puzzles</span>
                        <small>Brain Teasers, Riddles</small>
                    </button>
                </div>
            </div>
        </div>

        <!-- Learning Content Screen -->
        <div class="learn-content-screen" id="learnContentScreen" style="display: none;">
            <div class="learn-topbar">
                <button class="back-to-topics-btn" id="backToTopicsBtn">
                    <i class="fas fa-arrow-left"></i> Back to Topics
                </button>
                <h2 class="learn-topic-title" id="learnTopicTitle">Quantitative Aptitude</h2>
                <a href="aptitude-challenges.html" class="practice-now-btn">
                    <i class="fas fa-play"></i> Practice Now
                </a>
            </div>

            <div class="learn-content-area">
                <div class="learning-content" id="learningContent">
                    <p>Loading content...</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="about.html" class="footer-link">About</a>
                <a href="login.html" class="footer-link">Login</a>
                <a href="aptitude-leaderboard.html" class="footer-link">Leaderboard</a>
                <a href="typing-tips.html" class="footer-link">Tips</a>
            </div>
            <div class="copyright">
                © <span id="current-year"></span> Key Racer - Aptitude & Reasoning
            </div>
        </div>
    </footer>

    <script src="../scripts/aptitude.js"></script>
    <script src="../scripts/header-auth.js"></script>
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        const topicNames = {
            'quant': 'Quantitative Aptitude',
            'logical-reasoning': 'Logical Reasoning',
            'verbal': 'Verbal Ability',
            'puzzles': 'Puzzles & Brain Teasers'
        };
        
        // Topic selection
        document.querySelectorAll('.learn-topic-card').forEach(card => {
            card.addEventListener('click', () => {
                const topic = card.dataset.topic;
                showLearningContent(topic);
            });
        });
        
        // Back to topics
        document.getElementById('backToTopicsBtn').addEventListener('click', () => {
            document.getElementById('learnWelcomeScreen').style.display = 'flex';
            document.getElementById('learnContentScreen').style.display = 'none';
        });
        
        function showLearningContent(topic) {
            document.getElementById('learnWelcomeScreen').style.display = 'none';
            document.getElementById('learnContentScreen').style.display = 'block';
            document.getElementById('learnTopicTitle').textContent = topicNames[topic];
            
            // Load content using aptitude manager
            if (window.aptitudeManager) {
                window.aptitudeManager.loadTopicContent(topic);
            }
        }
    </script>
</body>
</html>
