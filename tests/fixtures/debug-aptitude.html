<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptitude Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a2e; color: #fff; }
        .debug-section { margin: 20px 0; padding: 15px; background: #16213e; border-radius: 8px; }
        .status { padding: 5px 10px; border-radius: 4px; margin: 5px 0; }
        .success { background: #28a745; }
        .error { background: #dc3545; }
        .warning { background: #ffc107; color: #000; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #000; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Aptitude Leaderboard Debug Tool</h1>
    
    <div class="debug-section">
        <h3>1. User Authentication Status</h3>
        <div id="authStatus"></div>
        <button onclick="checkAuth()">Check Auth</button>
        <button onclick="clearAuth()">Clear Auth Data</button>
    </div>

    <div class="debug-section">
        <h3>2. Server Status</h3>
        <div id="serverStatus"></div>
        <button onclick="checkServer()">Check Server</button>
    </div>

    <div class="debug-section">
        <h3>3. API Endpoints Test</h3>
        <div id="apiStatus"></div>
        <button onclick="testAPIs()">Test APIs</button>
    </div>

    <div class="debug-section">
        <h3>4. Leaderboard Data</h3>
        <div id="leaderboardData"></div>
        <button onclick="fetchLeaderboard()">Fetch Leaderboard</button>
    </div>

    <div class="debug-section">
        <h3>5. Test Submission</h3>
        <div id="submissionTest"></div>
        <button onclick="testSubmission()">Test Submission</button>
    </div>

    <script>
        function addStatus(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            container.appendChild(div);
        }

        function clearContainer(containerId) {
            document.getElementById(containerId).innerHTML = '';
        }

        function checkAuth() {
            clearContainer('authStatus');
            
            const user = localStorage.getItem('typingTestUser');
            const email = localStorage.getItem('typingTestUserEmail');
            
            if (user && email) {
                addStatus('authStatus', `✓ User: ${user}`, 'success');
                addStatus('authStatus', `✓ Email: ${email}`, 'success');
            } else if (user) {
                addStatus('authStatus', `⚠ User: ${user} (no email)`, 'warning');
                addStatus('authStatus', `Generated email: ${user}@guest.local`, 'warning');
            } else {
                addStatus('authStatus', '✗ No user authentication found', 'error');
                addStatus('authStatus', 'Scores will not be saved to leaderboard', 'error');
            }
        }

        async function checkServer() {
            clearContainer('serverStatus');
            
            try {
                const response = await fetch('/api/health');
                if (response.ok) {
                    addStatus('serverStatus', '✓ Server is running', 'success');
                    const data = await response.json();
                    addStatus('serverStatus', `Status: ${data.status}`, 'success');
                } else {
                    addStatus('serverStatus', `✗ Server error: ${response.status}`, 'error');
                }
            } catch (error) {
                addStatus('serverStatus', '✗ Server is not running', 'error');
                addStatus('serverStatus', 'Start server with: cd server && npm start', 'error');
            }
        }

        async function testAPIs() {
            clearContainer('apiStatus');
            
            // Test leaderboard API
            try {
                const response = await fetch('/api/aptitude/leaderboard');
                if (response.ok) {
                    addStatus('apiStatus', '✓ Leaderboard API working', 'success');
                } else {
                    addStatus('apiStatus', `✗ Leaderboard API error: ${response.status}`, 'error');
                }
            } catch (error) {
                addStatus('apiStatus', '✗ Leaderboard API failed', 'error');
            }

            // Test questions API
            try {
                const response = await fetch('/api/aptitude/questions/quant/easy');
                if (response.ok) {
                    addStatus('apiStatus', '✓ Questions API working', 'success');
                } else {
                    addStatus('apiStatus', `✗ Questions API error: ${response.status}`, 'error');
                }
            } catch (error) {
                addStatus('apiStatus', '✗ Questions API failed', 'error');
            }
        }

        async function fetchLeaderboard() {
            clearContainer('leaderboardData');
            
            try {
                const response = await fetch('/api/aptitude/leaderboard');
                if (response.ok) {
                    const data = await response.json();
                    addStatus('leaderboardData', '✓ Leaderboard fetched successfully', 'success');
                    
                    if (data.leaderboard && data.leaderboard.length > 0) {
                        addStatus('leaderboardData', `Found ${data.leaderboard.length} entries`, 'success');
                        
                        const pre = document.createElement('pre');
                        pre.textContent = JSON.stringify(data.leaderboard, null, 2);
                        document.getElementById('leaderboardData').appendChild(pre);
                    } else {
                        addStatus('leaderboardData', '⚠ Leaderboard is empty', 'warning');
                    }
                } else {
                    addStatus('leaderboardData', `✗ Failed to fetch: ${response.status}`, 'error');
                }
            } catch (error) {
                addStatus('leaderboardData', `✗ Error: ${error.message}`, 'error');
            }
        }

        async function testSubmission() {
            clearContainer('submissionTest');
            
            const user = localStorage.getItem('typingTestUser');
            const email = localStorage.getItem('typingTestUserEmail') || (user ? `${user}@guest.local` : null);
            
            if (!user) {
                addStatus('submissionTest', '✗ Cannot test - no user logged in', 'error');
                return;
            }

            const testData = {
                email: email,
                displayName: user,
                answers: ['100', '25%', '₹200'],
                timeTaken: 120,
                questionIds: ['q1', 'q2', 'q3']
            };

            try {
                const response = await fetch('/api/aptitude/submit-secure', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(testData)
                });

                if (response.ok) {
                    const result = await response.json();
                    addStatus('submissionTest', '✓ Test submission successful', 'success');
                    
                    const pre = document.createElement('pre');
                    pre.textContent = JSON.stringify(result, null, 2);
                    document.getElementById('submissionTest').appendChild(pre);
                } else {
                    const error = await response.text();
                    addStatus('submissionTest', `✗ Submission failed: ${response.status}`, 'error');
                    addStatus('submissionTest', error, 'error');
                }
            } catch (error) {
                addStatus('submissionTest', `✗ Error: ${error.message}`, 'error');
            }
        }

        function clearAuth() {
            localStorage.removeItem('typingTestUser');
            localStorage.removeItem('typingTestUserEmail');
            addStatus('authStatus', 'Authentication data cleared', 'warning');
        }

        // Auto-run checks on page load
        window.onload = function() {
            checkAuth();
            checkServer();
        };
    </script>
</body>
</html>
