<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4P5RF6RD8J"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4P5RF6RD8J');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Agent - KeyRacer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/ai-career-agent-enhanced.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .mode-switcher {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #e8eaed;
            flex-wrap: wrap;
        }
        .mode-btn {
            flex: 1;
            min-width: 150px;
            padding: 12px 20px;
            border: 2px solid #dadce0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .mode-btn:hover {
            border-color: #4285f4;
            background: #f8f9fa;
        }
        .mode-btn.active {
            background: #4285f4;
            color: white;
            border-color: #4285f4;
        }
        .resume-upload-section {
            padding: 15px;
            background: #e8f0fe;
            border-bottom: 1px solid #dadce0;
            text-align: center;
        }
        .upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #1a73e8;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .upload-btn:hover {
            background: #1557b0;
        }
        .system-message .message-content {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }
        .error-message .message-content {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
        }
    </style>
</head>
<body>
    <!-- Main Container -->
    <div class="gemini-container">
        <!-- Header -->
        <header class="gemini-header">
            <div class="header-content">
                <div class="logo-section">
                    <img src="assets/images/logo.png" alt="KeyRacer" class="logo-img">
                    <h1>KeyRacer AI Career Agent</h1>
                </div>
                <div class="header-actions">
                    <button id="reset-chat" class="action-btn" title="New Chat">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="action-btn" title="Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Mode Switcher -->
        <div class="mode-switcher">
            <button class="mode-btn active" data-mode="market">
                <i class="fas fa-chart-line"></i>
                Market Insights
            </button>
            <button class="mode-btn" data-mode="roadmap">
                <i class="fas fa-map"></i>
                Learning Roadmap
            </button>
            <button class="mode-btn" data-mode="interview">
                <i class="fas fa-briefcase"></i>
                Interview Prep
            </button>
        </div>

        <!-- Resume Upload -->
        <div class="resume-upload-section">
            <label for="resume-upload" class="upload-btn">
                <i class="fas fa-file-pdf"></i>
                Upload Resume for Analysis
            </label>
            <input type="file" id="resume-upload" accept=".pdf" style="display: none;">
        </div>

        <div class="main-content">
            <!-- History Sidebar -->
            <aside class="chat-history-sidebar">
                <h2 class="history-title"><i class="fas fa-history"></i> Chat History</h2>
                <ul id="chat-history-list" class="chat-history-list">
                    <!-- Chat history items will be added here -->
                </ul>
            </aside>

            <!-- Chat Container -->
            <div class="chat-container">
                <!-- Chat Messages -->
                <div id="chat-messages" class="chat-messages">
                    <!-- Messages will be added here dynamically -->
                </div>
            </div>
        </div>

        <!-- Input Container -->
        <div class="input-container">
            <div class="input-wrapper">
                <div class="input-field">
                    <input 
                        type="text" 
                        id="chat-input" 
                        placeholder="Ask your AI career agent anything..." 
                        maxlength="1000"
                        autocomplete="off"
                    >
                    <button id="send-button" class="send-btn">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
                <div class="input-footer">
                    <span class="disclaimer">AI can make mistakes. Consider checking important information.</span>
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typing-indicator" class="typing-indicator" style="display: none;">
            <div class="typing-animation">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
        
        <!-- AI Agent Status -->
        <div class="agent-status online">
            <i class="fas fa-robot"></i>
            AI Agent Online
        </div>
    </div>

    <!-- AI Career Agent Script -->
    <script src="scripts/ai-career-agent.js"></script>
</body>
</html>
