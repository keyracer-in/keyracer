<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyRacer AI Career Agent</title>
    <!-- Design System Foundation -->
    <link rel="stylesheet" href="../styles/design-system.css">
    <link rel="stylesheet" href="../styles/ai-career-agent-enhanced.css">
    <link rel="stylesheet" href="../styles/response-cards.css">
    <link rel="stylesheet" href="../styles/input-area-enhancements.css">
    <link rel="stylesheet" href="../styles/session-manager.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- App Shell with Grid Layout -->
    <div class="app-shell" role="application" aria-label="AI Career Agent">
        
        <!-- Header Component -->
        <header class="app-header" role="banner">
            <div class="header-left">
                <button class="sidebar-toggle" 
                        aria-label="Toggle sidebar" 
                        aria-expanded="true"
                        aria-controls="session-sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="logo">
                    <img src="../assets/images/logo.png" alt="KeyRacer Logo" class="logo-img">
                    <span class="logo-text">AI Career Agent</span>
                </div>
            </div>
            
            <div class="header-center">
                <div class="mode-selector" role="tablist" aria-label="Agent mode selection">
                    <button role="tab" 
                            class="mode-btn active" 
                            data-mode="career"
                            aria-selected="true"
                            aria-controls="chat-container"
                            id="mode-career">
                        <i class="fas fa-briefcase"></i>
                        <span>Career Guidance</span>
                    </button>
                    <button role="tab" 
                            class="mode-btn" 
                            data-mode="interview"
                            aria-selected="false"
                            aria-controls="chat-container"
                            id="mode-interview">
                        <i class="fas fa-microphone"></i>
                        <span>Interview Prep</span>
                    </button>
                    <div class="mode-indicator" aria-hidden="true"></div>
                </div>
            </div>
            
            <div class="header-right">
                <button class="help-btn" 
                        aria-label="Help"
                        title="Get help">
                    <i class="fas fa-question-circle"></i>
                </button>
                <button class="settings-btn" 
                        aria-label="Settings"
                        title="Open settings">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>

        <!-- Session Sidebar Component -->
        <aside class="session-sidebar" 
               id="session-sidebar"
               role="complementary" 
               aria-label="Chat sessions">
            <div class="sidebar-header">
                <button class="new-chat-btn" aria-label="Start new chat">
                    <i class="fas fa-plus"></i>
                    <span>New Chat</span>
                </button>
            </div>
            
            <div class="sidebar-search">
                <i class="fas fa-search" aria-hidden="true"></i>
                <input type="text" 
                       placeholder="Search conversations..." 
                       aria-label="Search conversations"
                       id="session-search">
            </div>
            
            <!-- Task 7.2: Mode filter buttons - Requirement 7.4 -->
            <div class="session-filters" role="toolbar" aria-label="Filter sessions by mode">
                <button class="filter-btn active" 
                        data-filter-mode="all"
                        aria-label="Show all sessions">
                    All
                </button>
                <button class="filter-btn" 
                        data-filter-mode="career"
                        aria-label="Show career sessions">
                    Career
                </button>
                <button class="filter-btn" 
                        data-filter-mode="interview"
                        aria-label="Show interview sessions">
                    Interview
                </button>
            </div>
            
            <nav class="session-list" role="navigation" aria-label="Chat history">
                <!-- Session groups will be dynamically generated by session-manager.js -->
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content" role="main" aria-label="Chat conversation">
            <!-- Chat Container -->
            <div class="chat-container" id="chat-container" role="tabpanel" aria-labelledby="mode-career">
                <!-- Mode Indicator Badge -->
                <div class="mode-indicator-badge" id="mode-indicator-badge" role="status" aria-live="polite">
                    <i class="fas fa-briefcase mode-badge-icon"></i>
                    <span class="mode-badge-text">Career Guidance</span>
                    <div class="mode-badge-tooltip">
                        Get comprehensive career advice, learning roadmaps, and job opportunities
                    </div>
                </div>
                
                <!-- Chat Messages -->
                <div id="chat-messages" 
                     class="chat-messages" 
                     role="log" 
                     aria-live="polite" 
                     aria-atomic="false"
                     aria-label="Chat messages">
                    <!-- Messages will be added here dynamically -->
                </div>
                
                <!-- Scroll to Bottom Button -->
                <button class="scroll-to-bottom" 
                        aria-label="Scroll to bottom"
                        style="display: none;">
                    <i class="fas fa-arrow-down"></i>
                </button>
            </div>
            
            <!-- Input Area -->
            <div class="input-area" role="region" aria-label="Message input">
                <!-- Quick Actions -->
                <div id="quick-actions" 
                     class="quick-actions" 
                     role="toolbar" 
                     aria-label="Quick actions">
                    <button class="quick-action-chip" 
                            data-action="upload-resume"
                            aria-label="Upload resume">
                        <i class="fas fa-upload" aria-hidden="true"></i>
                        <span>Upload Resume</span>
                    </button>
                    <button class="quick-action-chip" 
                            data-action="generate-roadmap"
                            aria-label="Generate learning roadmap">
                        <i class="fas fa-map" aria-hidden="true"></i>
                        <span>Generate Roadmap</span>
                    </button>
                    <button class="quick-action-chip" 
                            data-action="find-jobs"
                            aria-label="Find job opportunities">
                        <i class="fas fa-briefcase" aria-hidden="true"></i>
                        <span>Find Jobs</span>
                    </button>
                    <button class="quick-action-chip" 
                            data-action="analyze-skills"
                            aria-label="Analyze skills">
                        <i class="fas fa-chart-bar" aria-hidden="true"></i>
                        <span>Skill Analysis</span>
                    </button>
                </div>
                
                <!-- File Upload Zone -->
                <div class="file-upload-zone" 
                     data-state="idle"
                     role="region"
                     aria-label="File upload area">
                    <i class="fas fa-paperclip" aria-hidden="true"></i>
                    <span>Drag & drop resume or click to upload</span>
                    <input type="file" 
                           id="resume-upload" 
                           accept=".pdf,.doc,.docx" 
                           hidden
                           aria-label="Upload resume file">
                </div>
                
                <!-- Text Input Wrapper -->
                <div class="text-input-wrapper">
                    <textarea 
                        class="text-input" 
                        id="chat-input"
                        placeholder="Ask your AI career agent anything..."
                        rows="1"
                        maxlength="1000"
                        aria-label="Message input"
                        aria-describedby="input-disclaimer"
                    ></textarea>
                    <button class="send-btn" 
                            id="send-button"
                            disabled
                            aria-label="Send message">
                        <i class="fas fa-paper-plane" aria-hidden="true"></i>
                    </button>
                </div>
                
                <!-- Input Disclaimer -->
                <div class="input-disclaimer" id="input-disclaimer">
                    <i class="fas fa-info-circle" aria-hidden="true"></i>
                    <span>AI can make mistakes. Verify important information.</span>
                </div>
            </div>
        </main>

        <!-- Typing Indicator -->
        <div id="typing-indicator" 
             class="typing-indicator" 
             role="status"
             aria-live="polite"
             aria-label="AI is typing"
             style="display: none;">
            <div class="typing-avatar">
                <i class="fas fa-robot" aria-hidden="true"></i>
            </div>
            <div class="typing-content">
                <div class="typing-dots" aria-hidden="true">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
                <span class="typing-text">AI is thinking...</span>
            </div>
        </div>
        
        <!-- Progress Indicator for Long Operations -->
        <div id="progress-indicator"
             class="progress-indicator"
             role="status"
             aria-live="polite"
             aria-label="Operation progress"
             style="display: none;">
            <div class="progress-header">
                <div class="progress-title">
                    <i class="fas fa-spinner"></i>
                    <span id="progress-title-text">Processing...</span>
                </div>
                <div class="progress-time" id="progress-time">
                    Estimated: <span id="progress-eta">--</span>
                </div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%"></div>
            </div>
            <div class="progress-status">
                <span id="progress-status-text">Initializing...</span>
                <span class="progress-percentage" id="progress-percentage">0%</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../scripts/markdown-formatter.js"></script>
    <script src="../scripts/response-cards.js"></script>
    <script src="../scripts/input-area-enhancements.js"></script>
    <script src="../scripts/session-manager.js"></script>
    <script src="../scripts/enhanced-ai-career-agent.js"></script>
</body>
</html>
