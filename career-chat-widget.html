<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyRacer AI Career Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/ai-career-agent-enhanced.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="gemini-container">
        <!-- Header -->
        <header class="gemini-header">
            <div class="header-content">
                <div class="logo-section">
                    <img src="assets/images/logo.png" alt="KeyRacer" class="logo-img">
                    <h1>KeyRacer AI Career Agent</h1>
                </div>
                <div class="header-actions">
                    <a href="preference.html" class="action-btn" title="Preference">
                        <i class="fas fa-sliders-h"></i>
                    </a>
                </div>
            </div>
        </header>

        <!-- Resume Upload -->
        <div class="resume-upload-section">
            <label for="resume-upload" class="upload-btn">
                <i class="fas fa-file-pdf"></i>
                Upload Resume for AI Analysis
            </label>
            <input type="file" id="resume-upload" accept=".pdf" style="display: none;">
        </div>

        <div class="main-content">
            <!-- History Sidebar -->
            <aside class="chat-history-sidebar">
                <h2 class="history-title"><i class="fas fa-history"></i> Chat History</h2>
                <ul id="chat-history-list" class="chat-history-list">
                    <!-- Chat history items will be added here -->
                </ul>
            </aside>

            <!-- Chat Container -->
            <div class="chat-container">
                <!-- Chat Messages -->
                <div id="chat-messages" class="chat-messages">
                    <!-- Messages will be added here dynamically -->
                </div>
            </div>
        </div>

        <!-- Input Container -->
        <div class="input-container">
            <div class="input-wrapper">
                <!-- Quick Suggestions -->
                <div id="quick-suggestions" class="quick-suggestions">
                    <div class="suggestion-item" data-text="Generate a learning roadmap for me">
                        <i class="fas fa-map"></i>
                        <span>Generate roadmap</span>
                    </div>
                    <div class="suggestion-item" data-text="Find job opportunities that match my skills">
                        <i class="fas fa-briefcase"></i>
                        <span>Find jobs</span>
                    </div>
                    <div class="suggestion-item" data-text="Start a mock interview">
                        <i class="fas fa-microphone"></i>
                        <span>Mock interview</span>
                    </div>
                    <div class="suggestion-item" data-text="What skills should I improve?">
                        <i class="fas fa-chart-bar"></i>
                        <span>Skill analysis</span>
                    </div>
                </div>
                <div class="input-field">
                    <input 
                        type="text" 
                        id="chat-input" 
                        placeholder="Ask your AI career agent anything..." 
                        maxlength="1000"
                        autocomplete="off"
                    >
                    <button id="send-button" class="send-btn">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
                <div class="input-footer">
                    <span class="disclaimer">AI can make mistakes. Consider checking important information.</span>
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typing-indicator" class="typing-indicator" style="display: none;">
            <div class="typing-animation">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
        
        <!-- AI Agent Status -->
        <div class="agent-status online">
            <i class="fas fa-robot"></i>
            AI Agent Online
        </div>
    </div>

    <script src="scripts/enhanced-ai-career-agent.js"></script>
</body>
</html>
